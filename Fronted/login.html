<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Rosas Eternas</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 2rem;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .login-container h1 {
      font-size: 24px;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
    }
    .error-message {
      color: var(--danger, #d71920);
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .btn-login {
      width: 100%;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- ── Navegación ────────────────────────────────── -->
  <nav id="mainNav">
    <a href="index.html" class="logo">
      <span class="logo-main">Detalles que enamoran</span>
      <span class="logo-sub">Rosas Eternas &amp; Detalles</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
    </div>
  </nav>

  <div class="login-container">
    <h1>Iniciar Sesión 🔐</h1>
    <div class="error-message" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-login">Entrar</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
